name: Daily Data Fetch
on:
  # 정시 실행은 외부 cron-job.org가 매일 KST 17:10에 workflow_dispatch로 트리거.
  # GitHub Actions schedule은 Free tier 큐 지연이 커서 사용하지 않음.
  workflow_dispatch:
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    # 전 종목 수집이 약 45분. 기본 360분 안에 충분히 들어가지만 명시해 둔다.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 배당수익률용 주당배당금. 분기에 한 번 바뀌는 값이라 7일 지난 경우에만
      # 실제로 조회하고, 그 외에는 즉시 끝난다.
      - name: Refresh dividends (weekly)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/kis_dividends.py

      # 수급/시세/재무/평균단가/기관세부 + 시장지수 + 스냅샷을 한 번에 수집.
      # 기존의 fetch_data / add_tickers / add_fundamentals / add_price_changes /
      # add_avg_cost / add_inst_detail / save_snapshot / augment_snapshots /
      # fetch_kospi_history 9개 스텝을 대체한다.
      - name: Fetch all (KIS Open API)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        # CI 는 매 실행이 새 워크스페이스라 캐시를 읽을 일이 없다. 쓰기만 하면
        # 원시 응답 700MB 가 그냥 버려지므로 끈다. (로컬 재실행 때만 유용)
        run: python scripts/kis_fetch.py --no-cache

      - name: Add sectors
        run: |
          python scripts/fetch_wics.py
          python scripts/add_sectors.py
      # 네이버 금융이 SPA(Npay 증권)로 개편되면서 HTML 스크래핑 경로가 죽었다.
      # 스크립트가 기존 theme-map.json 을 보존하고 exit 1 로 알리므로, 여기서는
      # 경고로만 남기고 파이프라인은 계속 간다. 테마 데이터는 마지막 수집분으로
      # 고정된 상태다.
      - name: Fetch themes
        run: python scripts/fetch_themes.py
        continue-on-error: true
      # Gemini 무료 티어로 생성한다(비용 0). 무료 티어는 붐비면 503 이 나므로
      # 스크립트가 재시도 + 하위 모델 폴백을 한다. 그래도 실패하면 그날 리포트만
      # 건너뛰고 데이터 커밋은 진행한다.
      - name: Generate AI report (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_report.py
        continue-on-error: true

      # 리포트가 실패한 날에도 수급 요약은 보낼 가치가 있으므로 리포트 스텝과
      # 독립적으로 돌린다. 발송 실패가 데이터 커밋을 막아서도 안 된다.
      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/send_telegram.py
        continue-on-error: true
      - name: Build stock timeseries
        run: python scripts/build_timeseries.py
      - name: Build V3 signals
        run: python scripts/build_v3_signals.py
      - name: Build market signals
        run: python scripts/build_market_signals.py
      # 종목별 252일 변동성과 분위. backtest_lowrisk.py 가 검정한 정의와
      # 같아야 하므로 스크립트 안에 기준을 고정해 뒀다.
      - name: Build volatility
        run: python scripts/build_volatility.py
      # 커뮤니티 배포용 글. 스크립트가 스스로 월요일인지 보고 아니면 즉시
      # 끝난다 — 커뮤니티는 주 1회가 상한이라 매일 만들면 쓸 데가 없다.
      - name: Draft community post (Mondays)
        run: python scripts/make_post.py
        continue-on-error: true

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 생성물은 항상 이번 실행분이 정답이다. rebase 로 병합하려 하면 그
          # 사이에 사람이 올린 커밋과 같은 파일에서 충돌한다 — 2026-09-16 에
          # signals.json / market-signals.json 에서 실제로 터져 하루치가 날아갔다.
          # HEAD 만 최신 main 으로 옮기고(작업트리는 그대로) 방금 만든 파일을
          # 그 위에 새 커밋으로 얹는다. 충돌이 구조적으로 생길 수 없다.
          git fetch origin main
          git reset --mixed origin/main
          git add public/data/ docs/posts/
          git diff --staged --quiet || git commit -m "daily data update $(date +'%Y-%m-%d')"
          git push origin HEAD:main

      # 갱신된 URL 을 네이버·Bing 에 직접 밀어 넣는다. 사이트맵은 크롤러가
      # 올 때까지 기다리는 수동 방식이라 네이버는 4개월간 거의 안 가져갔다.
      # 색인 요청이 실패해도 데이터는 이미 커밋됐으므로 파이프라인은 통과시킨다.
      - name: Ping IndexNow (Naver / Bing)
        run: python scripts/indexnow.py
        continue-on-error: true
