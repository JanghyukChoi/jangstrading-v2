name: Daily Data Fetch

on:
  schedule:
    # 매일 KST 16:40 (UTC 07:40) — 장 마감 후 데이터 갱신
    - cron: '40 7 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch stock data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Add ticker codes
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_tickers.py

      - name: Add PER/PBR
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_fundamentals.py

      - name: Add price changes
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_price_changes.py

      - name: Add avg cost
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_avg_cost.py

      - name: Add sectors
        run: |
          python scripts/fetch_wics.py
          python scripts/add_sectors.py

      - name: Fetch themes
        run: python scripts/fetch_themes.py

      - name: Generate AI report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "📊 데이터 갱신 $(date +'%Y-%m-%d')"
          git push
