name: Daily Data Fetch
on:
  # 정시 실행은 외부 cron-job.org가 매일 KST 17:10에 workflow_dispatch로 트리거.
  # GitHub Actions schedule은 Free tier 큐 지연이 커서 사용하지 않음.
  workflow_dispatch:
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    # 전 종목 수집이 약 45분. 기본 360분 안에 충분히 들어가지만 명시해 둔다.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 배당수익률용 주당배당금. 분기에 한 번 바뀌는 값이라 7일 지난 경우에만
      # 실제로 조회하고, 그 외에는 즉시 끝난다.
      - name: Refresh dividends (weekly)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/kis_dividends.py

      # 수급/시세/재무/평균단가/기관세부 + 시장지수 + 스냅샷을 한 번에 수집.
      # 기존의 fetch_data / add_tickers / add_fundamentals / add_price_changes /
      # add_avg_cost / add_inst_detail / save_snapshot / augment_snapshots /
      # fetch_kospi_history 9개 스텝을 대체한다.
      - name: Fetch all (KIS Open API)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/kis_fetch.py

      - name: Add sectors
        run: |
          python scripts/fetch_wics.py
          python scripts/add_sectors.py
      - name: Fetch themes
        run: python scripts/fetch_themes.py
      - name: Generate AI report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py
      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/send_telegram.py
      - name: Build stock timeseries
        run: python scripts/build_timeseries.py
      - name: Build V3 signals
        run: python scripts/build_v3_signals.py
      - name: Build market signals
        run: python scripts/build_market_signals.py
      - name: Build market regime (HMM)
        run: python scripts/build_regime.py
        continue-on-error: true
      - name: Build sector RRG
        run: python scripts/build_rrg.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "daily data update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
