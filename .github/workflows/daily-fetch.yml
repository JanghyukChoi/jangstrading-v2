name: Daily Data Fetch
on:
  # 정시 실행은 외부 cron-job.org가 매일 KST 17:10에 workflow_dispatch로 트리거.
  # GitHub Actions schedule은 Free tier 큐 지연이 커서 사용하지 않음.
  workflow_dispatch:
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch stock data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/fetch_data.py
      - name: Add ticker codes
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_tickers.py
      - name: Add PER/PBR
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_fundamentals.py
      - name: Add price changes
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_price_changes.py
      - name: Add avg cost
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_avg_cost.py
      - name: Add inst detail
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/add_inst_detail.py
      - name: Add sectors
        run: |
          python scripts/fetch_wics.py
          python scripts/add_sectors.py
      - name: Fetch themes
        run: python scripts/fetch_themes.py
      - name: Generate AI report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py
      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/send_telegram.py  
      - name: Save snapshot
        run: python scripts/save_snapshot.py
      - name: Augment snapshot (market_cap + trade_value)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/augment_snapshots.py --input public/data/snapshots
      - name: Fetch KOSPI history (regime filter용)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/fetch_kospi_history.py
      - name: Build stock timeseries
        run: python scripts/build_timeseries.py
      - name: Build V3 signals
        run: python scripts/build_v3_signals.py
      - name: Build market signals
        run: python scripts/build_market_signals.py
      - name: Build market regime (HMM)
        run: python scripts/build_regime.py
        continue-on-error: true
      - name: Build sector RRG
        run: python scripts/build_rrg.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "daily data update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
